<link rel="apple-touch-icon" href="/static/icon-192.png"><title>Reset Password</title><link rel="stylesheet" href="/static/style.css"></head><body><div class="box"><h1>🔑 Set New Password</h1><p>For: <b>{{ email }}</b><br>Your old password is gone. Create a new one and remember it. We advise you to reset and keep it safe.</p><form method="POST" action="/reset_password"><input name="new_password" placeholder="New Password (min 4 characters)" type="password" required><button>Save New Password →</button></form></div><script>
