<!DOCTYPE html><html><head><link rel="manifest" href="/manifest.json">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="apple-touch-icon" href="/static/icon-192.png"><title>Note Summarizer</title><link rel="stylesheet" href="/static/style.css"></head>
<body><div class="nav"><a href="/">← Back to Dashboard</a></div>
<div class="container"><div class="card">

if ("serviceWorker" in navigator) {
  window.addEventListener("load", function() {
    navigator.serviceWorker.register("/sw.js").then(function(reg){
      console.log("Student Helper App installed ✅", reg.scope);
    }).catch(function(err){
      console.log("App install failed", err);
    });
  });
}
